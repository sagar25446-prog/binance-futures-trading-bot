[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-futures-trading-bot"
dynamic = ["version"]
description = "CLI trading bot for Binance USDT-M Futures Testnet: Market, Limit and Stop-Limit orders with validation and structured logging."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sagar Jain" }]
keywords = ["binance", "futures", "trading", "cli", "testnet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
trading-bot = "cli:main"

[tool.setuptools]
packages = ["bot"]
py-modules = ["cli", "main"]

[tool.setuptools.dynamic]
version = { attr = "bot.__version__" }

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E501", # long lines: handled by the formatter-free style used in this repo
    "B904", # `raise ... from` inside except: the exceptions here are deliberately flat
]

[tool.ruff.lint.isort]
known-first-party = ["bot", "cli"]

[tool.coverage.run]
source = ["bot", "cli"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if sys.platform == \"win32\":",
]
